<style>
/* Western Elite: navy header band, brand blue accent, cool white page. Semantic colors stay separate from the brand. */

  --text:#e6ecf5; --muted:#93a2ba; --accent:#4fb0ee; --accent-soft:#0f2f4a; --on-accent:#00284a;

  --blue:#5fd0e6; --blue-soft:#13303a; --violet:#c3a6ff; --violet-soft:#2b2340;

  }
}
:root[data-theme="dark"]{
  --navy:#00284a; --navy-fg:#eef3fb; --navy-muted:#8fa3c2; --navy-active:rgba(255,255,255,.12);
  --bg:#0c1422; --surface:#121c2e; --surface-2:#18243a; --border:#25334d;
  --text:#e6ecf5; --muted:#93a2ba; --accent:#4fb0ee; --accent-soft:#0f2f4a; --on-accent:#00284a;

<body>
<header>
  <div class="bar">
    <div class="brand">DAR Sales Dashboard<small>Daily Activity Review, filtered for sales</small></div>
    <nav>
      <button data-page="dash" aria-current="page">Dashboard</button>
      <button data-page="reps">By Sales Rep</button>
      <button data-page="mrf">MRF</button>
    </nav>
    <div class="spacer"></div>
    <span class="who hidden" id="who"></span>
    <button class="btn ghost sm hidden" id="signOutBtn">Sign out</button>
    <button class="btn primary" id="uploadBtn">Upload DAR</button>
    <input type="file" id="file" accept=".pdf,.xlsx,.xls,.csv" class="hidden">
  </div>
</header>

<main>
  <section id="signin" class="signin hidden">
    <form id="signinForm" novalidate>
      <h2>Sign in</h2>
      <p>Enter your Western Elite email. You'll only need to do this once on this computer.</p>
      <label for="siEmail">Work email</label>
      <input id="siEmail" type="email" autocomplete="email" placeholder="name@westernelite.com" required>
      <button class="btn primary" type="submit" id="siBtn">Continue</button>

    <div class="kpis" id="kpis"></div>

    <div class="reps" id="repTabs"></div>

      <input type="search" id="repSearch" placeholder="Search customer, address, code…">
      <label class="chk"><input type="checkbox" id="flaggedOnly"> Flagged only</label>

    <div id="repBody"></div>
  </section>

  <section id="page-mrf" class="hidden">
    <div class="toolbar">
      <input type="search" id="mrfSearch" placeholder="Search customer, address, code…">
    </div>
    <div id="mrfBody"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
const CFG = window.DAR_CONFIG;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n.toLocaleString("en-US", {style:"currency", currency:"USD"});
const SITE_RE = new RegExp("\\b(" + CFG.cancelSiteNames.join("|") + ")\\b", "i");
const isMrf = r => r.code.includes(String(CFG.mrfCodeText).toUpperCase());
const salesRows = () => state.rows.filter(r => !isMrf(r));
const isCancel = r => SITE_RE.test(r.site2) && /F$/.test(r.code);
const CODE_RE = new RegExp("^(" + CFG.normalSizes.join("|") + ")(" + CFG.normalSuffixes.join("|") + ")$", "i");
const EXTRA_STD = new Set((CFG.extraStandardCodes || []).map(c => String(c).toUpperCase().replace(/\s+/g,"")));
const isStdCode = code => CODE_RE.test(code) || EXTRA_STD.has(String(code).toUpperCase().replace(/\s+/g,""));

const FIELDS = ["acct","customer","address","site2","contact","phone","zip","code","total"];
const HEADER_MAP = { acctnbr:"acct", acct:"acct", accountnumber:"acct", customer:"customer", siteaddress:"address",
  sitename2:"site2", sitecontact:"contact", sitephone:"phone", sitezip:"zip", zip:"zip", code:"code", total:"total" };
const normHeader = h => String(h||"").toLowerCase().replace(/[^a-z0-9]/g,"");

let state = { rows: [], fileName: "", period: "", page: "dash", rep: null };
let notNew = new Set();
let store = null;

/* ---------- Sign-in + shared data (Supabase) ---------- */
const SB_WANTED = !!(CFG.supabase?.url && CFG.supabase?.anonKey);
let sb = null, user = null;
const domainOk = email => !CFG.allowedEmailDomain || String(email||"").toLowerCase().endsWith("@" + CFG.allowedEmailDomain.toLowerCase());
const needsSignIn = () => !!sb && !user;

// Email-only sign-in: the email is remembered in this browser and recorded on each upload. No password, no email check.
const EMAIL_KEY = "dar.email";
async function initAuth(){
  if (!SB_WANTED) return;
  if (!window.supabase?.createClient){ setTimeout(() => toast("Couldn't connect to the shared data. Check your connection and reload."), 300); return; }
  sb = window.supabase.createClient(CFG.supabase.url, CFG.supabase.anonKey, {auth:{persistSession:false, autoRefreshToken:false}});
  let email = ""; try { email = localStorage.getItem(EMAIL_KEY) || ""; } catch {}
  user = email && domainOk(email) ? {email} : null;
}

// Read every row of a table, 1000 at a time (Supabase caps each request at 1000)
async function readAll(table, cols){
  let out = [];
  for (let from = 0; ; from += 1000){
    const { data, error } = await sb.from(table).select(cols).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) return out;
  }
}

async function initStore(){
  if (sb && user){
    const T = CFG.supabase.table;
    let ids = new Set();
    const load = async () => { ids = new Set((await readAll(T, "acct")).map(x => String(x.acct))); };
    try{
      await load();
      store = { mode: "shared", all: () => new Set(ids), refresh: load,
        async add(acct){
          const { error } = await sb.from(T).upsert({acct}, {onConflict:"acct", ignoreDuplicates:true});
          if (error) throw new Error("Couldn't save: " + error.message);
          ids.add(acct);
        },
        async remove(acct){
          const { error } = await sb.from(T).delete().eq("acct", acct);
          if (error) throw new Error("Couldn't undo: " + error.message);
          ids.delete(acct);
        } };
      return;
    }catch(e){ console.warn("Shared not-new list unavailable:", e); }
  }
  const KEY = "dar.notNew";
  const read = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); } };
  const write = s => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch {} };
  store = { mode:"local", all: read,
    async add(a){ const s = read(); s.add(a); write(s); },
    async remove(a){ const s = read(); s.delete(a); write(s); } };
}

/* ---------- Price history ---------- */
const pad2 = n => String(n).padStart(2, "0");
function parsePeriod(p){
  const m = String(p||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*to\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  return m ? {start: `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`, end: `${m[6]}-${pad2(m[4])}-${pad2(m[5])}`} : null;
}
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDate = iso => { const [y,m,d] = String(iso||"").split("-"); return y ? `${+m}/${+d}/${y}` : ""; };
function hashStr(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
}
// One price per account + code in a DAR: the most common amount above $0 (the higher one on a tie)
function priceKeys(rows){
  const m = new Map();
  rows.forEach(r => {
    if (!(r.total > 0) || !r.code) return;
    const k = r.acct + "|" + r.code;
    if (!m.has(k)) m.set(k, {acct: r.acct, code: r.code, customer: r.customer, counts: new Map()});
    const c = m.get(k).counts, v = Math.round(r.total * 100) / 100;
    c.set(v, (c.get(v) || 0) + 1);
  });
  return [...m.values()].map(x => {
    let best = null, bn = -1;
    x.counts.forEach((n, v) => { if (n > bn || (n === bn && v > best)){ best = v; bn = n; } });
    return {acct: x.acct, code: x.code, customer: x.customer, price: best};
  });
}
// Compare this DAR with earlier ones, then save it to the history
async function syncHistory(){
  const per = parsePeriod(state.period);
  const start = per?.start || todayIso(), end = per?.end || todayIso();
  const prices = priceKeys(state.rows);
  const fingerprint = hashStr(start + end + "\n" + state.rows.map(r => [r.acct, r.code, r.total, r.address].join("~")).sort().join("\n"));

  const { data: past, error: e1 } = await sb.rpc("dar_previous_prices", {p_before: end, p_accts: [...new Set(prices.map(p => p.acct))]});
  if (e1) throw e1;
  const prev = {};
  (past?.prices || []).forEach(p => { prev[p.acct + "|" + p.code] = {price: Number(p.price), period_end: p.period_end}; });

  const { data: up, error: e2 } = await sb.from("dar_uploads")
    .upsert({fingerprint, file_name: state.fileName, period_start: start, period_end: end, row_count: state.rows.length, uploaded_by: user?.email || null},
            {onConflict: "fingerprint", ignoreDuplicates: true})
    .select("id");
  if (e2) throw e2;
  const already = !up?.length;
  if (!already){
    const id = up[0].id;
    for (let i = 0; i < prices.length; i += 500){
      const { error } = await sb.from("dar_prices").insert(prices.slice(i, i + 500).map(p =>
        ({upload_id: id, acct: p.acct, code: p.code, price: p.price, customer: p.customer, period_end: end})));
      if (error) throw error;
    }
  }
  return {prev, history: {earlier: past?.uploads || 0, already, undated: !per}};
}

/* ---------- Parsing ---------- */
function parseMoney(v){
  if (typeof v === "number") return v;
  const s = String(v||"").trim(); if (!s) return 0;
  const neg = /^\(.*\)$/.test(s) || s.includes("-");
  const n = parseFloat(s.replace(/[^0-9.]/g,"")) || 0;
  return neg ? -n : n;
}
function cleanRow(r){
  const o = {};
  FIELDS.forEach(f => o[f] = String(r[f] ?? "").replace(/\s+/g," ").trim());
  // A long zip can run into the code column in the PDF ("89030-4443 40EX")
  if (!o.code && /\s/.test(o.zip)){ const p = o.zip.split(" "); o.zip = p.shift(); o.code = p.join(" "); }
  // Excel/CSV can turn "07110" into the number 7110
  if (/^\d{3,4}$/.test(o.zip)) o.zip = o.zip.padStart(5, "0");
  o.code = o.code.toUpperCase();
  o.total = parseMoney(r.total);
  o.zip5 = (o.zip.match(/\d{5}/) || [""])[0];
  o.section = r.section || "";
  return o;
}

async function parseSheet(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array", raw: /\.csv$/i.test(file.name)});
  const rows = []; let period = "";
  wb.SheetNames.forEach(name => {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
    let cols = null, section = "";
    for (const line of grid){
      if (!period){ const m = line.join(" ").match(/(\d{1,2}\/\d{1,2}\/\d{4}\s*to\s*\d{1,2}\/\d{1,2}\/\d{4})/i); if (m) period = m[1]; }
      const keys = line.map(c => HEADER_MAP[normHeader(c)]);
      if (keys.includes("acct") && keys.includes("code")){ cols = keys; continue; }
      if (!cols) continue;
      const r = {section};
      cols.forEach((k,i) => { if (k) r[k] = line[i]; });
      const acct = String(r.acct ?? "").trim();
      if (/^\d+$/.test(acct)) rows.push(cleanRow(r));
      else if (acct && line.filter(c => String(c).trim()).length === 1) section = acct;
    }
  });
  return {rows, period};
}

async function parsePdf(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const rows = []; let cols = null, section = "", period = "";
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // Group text pieces into lines by their vertical position
    const lines = [];
    tc.items.filter(it => it.str.trim()).forEach(it => {
      const x = it.transform[4], y = it.transform[5];
      let line = lines.find(l => Math.abs(l.y - y) < 3);
      if (!line){ line = {y, items:[]}; lines.push(line); }
      line.items.push({x, str: it.str});
    });
    lines.sort((a,b) => b.y - a.y).forEach(l => l.items.sort((a,b) => a.x - b.x));
    for (const l of lines){
      const text = l.items.map(i => i.str).join(" ");
      if (!period){ const m = text.match(/(\d{1,2}\/\d{1,2}\/\d{4}\s*to\s*\d{1,2}\/\d{1,2}\/\d{4})/i); if (m) period = m[1]; }
      const hdr = l.items.map(i => HEADER_MAP[normHeader(i.str)]);
      if (hdr.includes("acct") && hdr.includes("code")){
        cols = l.items.map((i,k) => ({key: hdr[k], x: i.x})).filter(c => c.key).sort((a,b) => a.x - b.x);
        continue;
      }
      if (!cols) continue;
      const r = {section};
      for (const it of l.items){
        let col = cols[0];
        for (const c of cols) if (it.x >= c.x - 8) col = c;
        r[col.key] = r[col.key] ? r[col.key] + " " + it.str : it.str;
      }
      const acct = String(r.acct || "").trim();
      if (/^\d+$/.test(acct) && (r.code || r.total)) rows.push(cleanRow(r));
      else if (l.items.length === 1 && /^[A-Za-z][A-Za-z .'-]{1,40}$/.test(text.trim()) && l.items[0].x < cols[1].x) section = text.trim();
    }
  }
  return {rows, period};
}

/* ---------- Analysis ---------- */
function analyze(){
  const rows = salesRows();
  const byAcct = new Map();
  rows.forEach(r => { if (!byAcct.has(r.acct)) byAcct.set(r.acct, []); byAcct.get(r.acct).push(r); });
  const highVolume = [...byAcct.entries()].filter(([,rs]) => rs.length > CFG.maxTransactions)
    .map(([acct, rs]) => ({acct, rows: rs, customer: rs[0].customer, zip: rs[0].zip5, total: rs.reduce((s,r)=>s+r.total,0)}))
    .sort((a,b) => b.rows.length - a.rows.length);
  const hvSet = new Set(highVolume.map(h => h.acct));
  const overPrice = rows.filter(r => r.total > CFG.priceThreshold).sort((a,b) => b.total - a.total);
  const oddCode = rows.filter(r => r.code && !isStdCode(r.code));
  const newAll = [...byAcct.entries()].filter(([a]) => a.endsWith(CFG.newAccountSuffix))
    .map(([acct, rs]) => ({acct, rows: rs, customer: rs[0].customer, zip: rs[0].zip5, contact: rs[0].contact, phone: rs[0].phone, address: rs[0].address, total: rs.reduce((s,r)=>s+r.total,0)}));
  const newAccts = newAll.filter(n => !notNew.has(n.acct));
  const newSet = new Set(newAccts.map(n => n.acct));
  const cancel = rows.filter(isCancel);
  const prev = state.prev || {};
  const changes = priceKeys(rows).filter(p => { const q = prev[p.acct + "|" + p.code]; return q && Math.abs(q.price - p.price) >= 0.01; })
    .map(p => { const q = prev[p.acct + "|" + p.code];
      return {...p, was: q.price, wasDate: q.period_end, diff: p.price - q.price, row: rows.find(r => r.acct === p.acct && r.code === p.code)}; })
    .sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  const chgSet = new Set(changes.map(c => c.acct + "|" + c.code));
  const flagsFor = r => ({
    cancel: isCancel(r), chg: chgSet.has(r.acct + "|" + r.code),
    vol: hvSet.has(r.acct), price: r.total > CFG.priceThreshold,
    code: !!r.code && !isStdCode(r.code), new: newSet.has(r.acct)
  });
  return {byAcct, cancel, changes, highVolume, overPrice, oddCode, newAll, newAccts, flagsFor};
}

function historyNote(){

}

      <div class="kpi"><div class="n">${money(all.reduce((t,r) => t + r.total, 0))}</div><div class="l">Total</div></div>
    </div>`
    + (byCode.length ? `<div class="reps">${byCode.map(([c,n]) => `<span class="pill">${esc(c)} <b>${n}</b></span>`).join("")}</div>` : "")
    + card("mrf-all", "MRF activity", rs.length, `Any code containing “${esc(CFG.mrfCodeText)}”. These rows are left off the Dashboard and By Sales Rep pages.`,
        txTable(rs, null, {rep:true, site2:true, plain:true}));
}

function render(){
  const locked = needsSignIn();
  $("#signin").classList.toggle("hidden", !locked);
  $("#uploadBtn").classList.toggle("hidden", locked);
  $("nav").classList.toggle("hidden", locked);
  $("#who").classList.toggle("hidden", !user); $("#signOutBtn").classList.toggle("hidden", !user);
  $("#who").textContent = user?.email || "";
  if (locked){ ["#dropZone","#page-dash","#page-reps","#page-mrf"].forEach(id => $(id).classList.add("hidden")); $("#meta").innerHTML = ""; return; }
  const has = state.rows.length > 0;
  $("#dropZone").classList.toggle("hidden", has);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.page===state.page ? "page" : "false"));
  $("#page-dash").classList.toggle("hidden", !has || state.page!=="dash");
  $("#page-reps").classList.toggle("hidden", !has || state.page!=="reps");
  $("#page-mrf").classList.toggle("hidden", !has || state.page!=="mrf");
  if (!has){ $("#meta").innerHTML = store?.mode==="local" ? "" : ""; return; }
  const a = analyze();
  const mrfCount = state.rows.filter(isMrf).length;
  document.querySelector('nav button[data-page="mrf"]').textContent = mrfCount ? `MRF (${mrfCount})` : "MRF";
  $("#meta").innerHTML = `<span class="pill">${esc(state.fileName)}</span>`
    + (state.period ? `<span>Period: <b>${esc(state.period)}</b></span>` : "")
    + `<span>${(state.rows.length - mrfCount).toLocaleString()} transactions · ${a.byAcct.size.toLocaleString()} accounts</span>`
    + (mrfCount ? `<span>${mrfCount.toLocaleString()} MRF on the MRF tab</span>` : "")
    + (Object.keys(CFG.zipToRep).length ? "" : `<span class="pill warn">Zip-to-rep list not set up yet</span>`)
    + (store.mode==="local" ? `<span class="pill warn">“Not new” saves to this computer only</span>` : "")
    + `<span class="spacer"></span><span class="allbtns"><button class="btn sm" data-all="open">Expand all</button><button class="btn sm" data-all="close">Collapse all</button></span>`;
  if (state.page==="dash") renderDash(a); else if (state.page==="reps") renderReps(a); else renderMrf();
}

/* ---------- Events ---------- */
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.card")) return;
  if (d.open) collapsed.delete(d.id); else collapsed.add(d.id);
  saveCollapsed();
}, true);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2600); }

async function loadFile(file){
  if (!file) return;
  toast("Reading " + file.name + "…");
  try{
    const res = /\.pdf$/i.test(file.name) ? await parsePdf(file) : await parseSheet(file);
    if (!res.rows.length) throw new Error("No transactions found. Is this a DAR with an AcctNbr header?");
    if (store.refresh){ try { await store.refresh(); notNew = store.all(); } catch {} }
    state.rows = res.rows; state.period = res.period; state.fileName = file.name; state.page = "dash";
    state.prev = {}; state.history = null;
    if (sb && user){
      toast("Checking price history…");
      try { Object.assign(state, await syncHistory()); }
      catch(err){ console.error(err); state.history = {error: err.message || "unknown error"}; }
    }
    try { localStorage.setItem("dar.last", JSON.stringify({rows:state.rows, period:state.period, fileName:state.fileName, prev:state.prev, history:state.history})); } catch {}
    render(); toast(res.rows.length + " transactions loaded");
  }catch(e){ console.error(e); toast(e.message || "Couldn't read that file"); }
}

$("#uploadBtn").onclick = () => $("#file").click();
$("#dropZone").onclick = () => $("#file").click();
$("#dropZone").onkeydown = e => { if (e.key==="Enter"||e.key===" ") $("#file").click(); };
$("#file").onchange = e => { loadFile(e.target.files[0]); e.target.value = ""; };
["dragover","dragenter"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $("#dropZone").classList.add("over"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $("#dropZone").classList.remove("over"); }));
document.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.page = b.dataset.page; render(); });
$("#repSearch").oninput = render; $("#mrfSearch").oninput = render; $("#flaggedOnly").onchange = render;

document.addEventListener("click", async e => {
  const t = e.target.closest("button, input"); if (!t) return;
  if (t.dataset.jump){ const el = document.getElementById(t.dataset.jump); if (el){ el.open = true; el.scrollIntoView({behavior:"smooth", block:"start"}); } }
  if (t.dataset.all){ document.querySelectorAll("details.card").forEach(d => d.open = t.dataset.all === "open"); }
  if (t.dataset.rep){ state.rep = t.dataset.rep; render(); }
  if (t.id === "showMarked"){ showMarked = t.checked; render(); }
  const acct = t.dataset.notnew || t.dataset.undo;
  if (acct){
    t.disabled = true;
    try{
      if (t.dataset.notnew){ await store.add(acct); notNew.add(acct); toast(acct + " marked not new"); }
      else { await store.remove(acct); notNew.delete(acct); toast(acct + " is back on the new list"); }
      render();
    }catch(err){ t.disabled = false; toast(err.message); }
  }
});

$("#signinForm").onsubmit = async e => {
  e.preventDefault();
  const email = $("#siEmail").value.trim().toLowerCase();
  const err = m => $("#siErr").textContent = m;
  if (!/^[^@\s]+@[^@\s]+$/.test(email)) return err("Enter your work email.");
  if (!domainOk(email)) return err(`Use your @${CFG.allowedEmailDomain} email.`);
  err(""); $("#siBtn").disabled = true;
  try { localStorage.setItem(EMAIL_KEY, email); } catch {}
  user = {email};
  await initStore(); notNew = store.all(); $("#siBtn").disabled = false; render();
};
$("#signOutBtn").onclick = async () => {
  user = null;
  try { localStorage.removeItem(EMAIL_KEY); localStorage.removeItem("dar.last"); } catch {}
  Object.assign(state, {rows: [], period: "", fileName: "", prev: {}, history: null});
  render();
};

(async () => {
  await initAuth();
  await initStore();
  notNew = store.all();
  try { const last = JSON.parse(localStorage.getItem("dar.last") || "null"); if (last?.rows?.length) Object.assign(state, last); } catch {}
  if (!state.rows.length && window.DAR_SAMPLE) Object.assign(state, {rows: window.DAR_SAMPLE.map(cleanRow), period: "11/6/2026 to 11/8/2026", fileName: "Example data · upload a DAR to replace",
    prev: window.DAR_DEMO_PREV || {}, history: window.DAR_DEMO_PREV ? {demo: true} : null});
  render();
})();
})();
</script>
